function gate(s,d,key){if(s.moveR)return['blocked','Movement-restricted (simulated biosecurity scenario). Excluded from matching; cannot transact.'];

 <div class="card"><h3>Recent activity</h3>${S.N.slice(0,4).map(n=>`<div class="s">${n.txt}</div>`).join('')}</div>`},
Marketplace(){const q=(S.q||'').toLowerCase(),ft=S.ft||'All',lim=S.lim||24,list=S.L.filter(l=>(ft=='All'||l.type==ft)&&(l.mat+l.biz+l.loc).toLowerCase().includes(q));return`<h2>Marketplace</h2><div class="card row"><input placeholder="🔍 Search material, business, place" value="${S.q||''}" onchange="S.q=this.value;S.lim=24;R()"><select onchange="S.ft=this.value;S.lim=24;R()">${['All','Supply','Demand'].map(o=>`<option ${o==ft?'selected':''}>${o}</option>`).join('')}</select></div><div class="s">${list.length} listings</div>`+list.slice(0,lim).map(l=>`<div class="card"><h3>${l.type}: ${l.mat} ${l.arch?'(archived)':''}</h3><div class="s">${l.biz} · ${l.loc} · ${l.type=='Supply'?`${f1(avail(l))} t available of ${l.qty} t · ${l.cond} · $${l.price}/t · disposal $${l.disp}/t · chemical history: ${l.chem}`:`${l.min}–${l.max} t for ${l.use1} · ≤${l.maxKm} km · ≤$${l.maxPrice}/t`}</div>${l.moveR?'<span class="tag blocked">⛔ Movement-restricted scenario</span>':''}<p><button class="btn alt" onclick="L('${l.id}').arch=!L('${l.id}').arch;save();R()">${l.arch?'Restore':'Archive'}</button> <button class="btn alt" onclick="if(confirm('Delete listing?')){S.L=S.L.filter(x=>x.id!='${l.id}');save();R()}">Delete</button></p></div>`).join('')+(list.length>lim?`<button class="btn" onclick="S.lim=${lim+24};R()">Show more</button>`:'')},
'Create Listing'(){const d=draft;return`<div class="hero"><h1>List it. Match it. Reuse it. 🌾</h1><p>${S.L.filter(l=>l.type=='Supply'&&!l.arch).length} supplies · ${S.L.filter(l=>l.type=='Demand'&&!l.arch).length} demands · ${new Set(S.L.map(l=>l.biz)).size} farmers &amp; businesses</p><button class="btn alt" onclick="guided()">▶ Try guided demo</button> <button class="btn alt" onclick="S.tab='Matches';R()">🤝 See matches</button></div><div class="card"><h3>Demo assistant <span class="s">(scripted parsing, not a live AI)</span></h3><textarea id="txt" rows="3" placeholder="I have 800 kg of overripe bananas in Pukekohe, available this Friday. They are unsellable.">${d?d.raw:''}</textarea><p><button class="btn" onclick="draft=parse($('txt').value);R()">Extract fields</button> <button class="btn alt" onclick="voice()">🎤 Speak</button> <span id="vs" class="s"></span></p>
 <p class="s">Examples: “I need 2 tonnes of plant material for composting near Hamilton next week.”</p></div>`+(d?`<div class="card"><h3>Editable draft — ${d.type}</h3><div class="row">${[['mat','Material'],['qty','Quantity (tonnes)'],['loc','Location (NZ city)'],['cond','Condition'],['from','Available from'],['price','Asking price $/t'],['disp','Disposal cost $/t (required)'],['use1','Intended use'],['maxKm','Max km'],['maxPrice','Max $/t'],['alt','Alternative cost $/t']].filter(([k])=>d.type=='Supply'?!['use1','maxKm','maxPrice','alt'].includes(k):!['price','disp','cond'].includes(k)).map(([k,n])=>`<div><label>${n}</label><input value="${d[k]}" onchange="draft['${k}']=this.value"></div>`).join('')}
 ${d.type=='Supply'?`<div><label>Chemical history</label><select onchange="draft.chem=this.value"><option value="unknown" ${d.chem=='unknown'?'selected':''}>Unknown (needs testing)</option><option value="declared-none" ${d.chem=='declared-none'?'selected':''}>No treatment (declared)</option></select></div>`:''}</div>
 <p class="s">Locations: ${Object.keys(CITY).join(', ')}. Nothing is published until you confirm.</p><button class="btn" onclick="publish()">Confirm and publish</button></div>`:'')},
Matches(){const a=ALL(),el=a.filter(m=>!m.block&&m.g[0]=='eligible'),rs=a.filter(m=>!m.block&&m.g[0]=='restricted'),nm=a.filter(m=>m.block);
 const card=m=>`<div class="card"><h3>${m.s.mat} → ${m.d.biz}</h3><div class="s">${m.s.biz} (${m.s.loc}) · ${f1(m.q)} t · score ${m.score}/100 · ${f1(m.e.dist)} km indicative · ~${m.e.mins} min</div>${tag(m.g)}<p class="s">${m.g[1]}</p>
 <table><tr><td>Transport (${m.e.t} trip(s), receiver pays)</td><td>${$n(m.e.tc)}</td></tr><tr><td>Supplier net benefit</td><td class="${m.e.sup<0?'neg':''}">${$n(m.e.sup)}</td></tr><tr><td>Receiver savings</td><td class="${m.e.rec<0?'neg':''}">${$n(m.e.rec)}${m.e.rec<0?' ⚠ unattractive':''}</td></tr><tr><td>Est. net CO₂e (range ${f1(m.e.lo)}…${f1(m.e.hi)})</td><td class="${m.e.net<0?'neg':''}">${f1(m.e.net)} kg${m.e.net<0?' ⚠ negative':''}</td></tr></table>
 <details><summary>Score factors &amp; formulas</summary><div class="s">${m.fac.map(([n,w,v])=>`${n}: weight ${w}, ${Math.round(Math.max(0,v)*100)}%`).join('<br>')}<br>Supplier = q×price + q×disposal − supplier transport. Receiver = q×alt − q×price − receiver transport. Net CO₂e = disposal ${f1(m.e.disp)} + displaced ${f1(m.e.alt)} − transport ${f1(m.e.tr)} − processing ${f1(m.e.pr)} kg (illustrative factors, substitution ${S.set.subst*100}%). Missing: lab evidence, processing costs assumed $0 (unknown).</div></details>
 ${m.g[0]=='eligible'?`<button class="btn" onclick="startTx('${m.key}')">Start simulated exchange</button>`:`<button class="btn alt" onclick="verify('${m.key}')">Complete demo verification (simulated evidence)</button> <button class="btn" disabled>Transaction blocked</button>`}</div>`;
 const st=S.set,sl=(k,n,step)=>`<div><label>${n}</label><input type="number" step="${step}" value="${st[k]}" onchange="S.set['${k}']=+this.value;save();R()"></div>`;
 return`<h2>Matches</h2><div class="card"><h3>Logistics assumptions (indicative, straight-line × multiplier)</h3><div class="row">${sl('mult','Road multiplier',.1)}${sl('speed','Speed km/h',5)}${sl('cap','Vehicle t',1)}${sl('perkm','$/km',.1)}${sl('fixed','Fixed $/trip',5)}${sl('subst','Substitution (0–1)',.1)}<div><label>Journey</label><select onchange="S.set.ret=this.value=='r';save();R()"><option value="r" ${st.ret?'selected':''}>Return (2× km)</option><option value="o" ${st.ret?'':'selected'}>One-way</option></select></div></div></div>
 <h3 class="t">Eligible (${el.length})</h3><div class="s">Top 10 by score shown</div>${el.sort((x,y)=>y.score-x.score).slice(0,10).map(card).join('')||'<div class="card s">No eligible matches yet.</div>'}<h3 class="t">Restricted — verification required (${rs.length})</h3>${rs.sort((x,y)=>y.score-x.score).slice(0,10).map(card).join('')}
 <h3 class="t">No match (${nm.length})</h3>${nm.slice(0,8).map(m=>`<div class="card s"><b>${m.s.mat} ↔ ${m.d.biz}</b>: ${m.block}</div>`).join('')}`},
Transactions(){return`<h2>Transactions</h2><div class="warn">Demo only: no real funds are collected, held, or released.</div><br>`+S.T.map(t=>{const s=L(t.s),d=L(t.d),g=gate(s,d,s.id+d.id),end=t.step==6||t.cx;return`<div class="card"><h3>${s.mat}: ${s.loc} → ${d.biz}</h3><div class="s">${f1(t.q)} t at $${t.price}/t · ${t.cx?'<b>'+t.cx.toUpperCase()+'</b>':t.step==6?'✔ Completed':'Next: '+STEPS[t.step+1]}</div>${tag(g)}<ol class="s">${t.log.map(l=>`<li>${l[0]} — ${l[1]}</li>`).join('')}</ol>${end?'':`<button class="btn" onclick="adv('${t.id}')">${STEPS[t.step+1]}</button> <button class="btn alt" onclick="cx('${t.id}','cancelled')">Cancel</button> <button class="btn alt" onclick="cx('${t.id}','dispute')">Raise dispute</button>`}</div>`}).join('')||'<p>No transactions.</p>'},
Impact(){return`<h2>Impact</h2><div class="card"><div class="big">${f1(co2())} kg CO₂e</div><div class="s">Completed-exchange scenario estimate · ${f1(tonnes())} t · each completed exchange counted once</div></div><div class="card"><h3>Completed</h3>${done().map(t=>`<div class="s">${L(t.s).mat}: ${f1(t.q)} t → ${f1(t.co2??econ(L(t.s),L(t.d),t.q).net)} kg</div>`).join('')||'None yet'}</div><div class="card s"><b>Method (illustrative demo factors, not sourced):</b> landfill disposal ${EF.disp} kg/t, displaced material ${EF.alt} kg/t, truck ${EF.truck} kg/km, processing ${EF.proc} kg/t. Net = avoided disposal + displaced production × substitution − transport − processing. Scenario estimates, not verified reductions or carbon credits.</div>`},
Profile(){return`<h2>Profile — ${S.role}</h2><div class="card"><b>${S.role=='Receiver'?'Waikato Compost Co':'Cambridge Orchard Co'} (fictional)</b><div class="s">Synthetic business, no real accreditation. Preferred distance ≤120 km · contact: in-app.</div></div><div class="card"><h3>Notifications</h3>${S.N.map(n=>`<div style="padding:4px 0;${n.read?'opacity:.6':'font-weight:700'}"><span class="s" style="color:inherit">${n.read?'':'● '}${n.txt}</span> <button class="btn alt" onclick="S.N.find(x=>x.id==${n.id}).read=1;S.tab='${n.tab}';save();R()">Open</button></div>`).join('')}</div><button class="btn alt" onclick="if(confirm('Reset all demo data?')){S=SEED();save();R()}">Reset demo data</button>`}};
function guided(){S.tab='Create Listing';draft=parse('I have 800 kg of overripe bananas in Pukekohe, available this Friday. They are unsellable, and I want to find a potential reuse option.');draft.disp=120;draft.chem='declared-none';save();R()}
R();
</script></body></html>
